server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: "configserver:http://config-server:8888"
  datasource:
    url: jdbc:postgresql://postgres:5432/syncdb
    username: appuser
    password: apppassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
