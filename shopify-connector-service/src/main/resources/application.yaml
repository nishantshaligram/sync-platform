server:
  port: 8083

spring:
  application:
    name: shopify-connector-service
  config:
    import: "optional:configserver:http://config-server:8888"
  datasource:
    url: jdbc:postgresql://postgres:5432/syncdb
    username: appuser
    password: apppassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_shopify
    baseline-on-migrate: true
    baseline-version: 0
  data:
    mongodb:
      uri: mongodb://appuser:apppassword@mongodb:27017/syncdb?authSource=admin
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    admin:
      fail-fast: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

shopify:
  client-id: ${SHOPIFY_CLIENT_ID:test_client_id}
  client-secret: ${SHOPIFY_CLIENT_SECRET:test_client_secret}
  redirect-uri: ${SHOPIFY_REDIRECT_URI:http://localhost:8080/shopify/oauth/callback}
  scopes: read_customers,read_orders,write_webhooks

management:
  endpoints:
    web:
      exposure:
        include: health,info
