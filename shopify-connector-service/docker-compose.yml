shopify-connector-service:
    build: ./shopify-connector-service
    container_name: shopify-connector-service
    depends_on:
      - postgres
      - mongodb
      - kafka
      - redis
      - eureka-server
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/syncdb
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppassword
      SPRING_DATA_MONGODB_URI: mongodb://appuser:apppassword@mongodb:27017/syncdb?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-test_client_id}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-test_client_secret}
      SHOPIFY_REDIRECT_URI: ${SHOPIFY_REDIRECT_URI:-http://localhost:8080/shopify/oauth/callback}