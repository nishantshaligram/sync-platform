server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    import: "configserver:http://config-server:8888"
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/subscriptions/**
        - id: shopify-connector-service
          uri: lb://shopify-connector-service
          predicates:
            - Path=/shopify/**
        - id: qbo-connector-service
          uri: lb://qbo-connector-service
          predicates:
            - Path=/qbo/**
        - id: sync-core-service
          uri: lb://sync-core-service
          predicates:
            - Path=/connections/**
