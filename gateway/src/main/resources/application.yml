server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    import: "configserver:http://config-server:8888"
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/subscriptions/**
        - id: shopify-connector-service
          uri: lb://shopify-connector-service
          predicates:
            - Path=/shopify/**
